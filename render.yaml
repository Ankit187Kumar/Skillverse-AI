# Render Blueprint: the FastAPI backend plus its PostgreSQL database.
# The Next.js frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: skillverse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillverse-db
          property: connectionString
      # Hosted model (Ollama can't run on Render's free tier). Any OpenAI-compatible API works.
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false # paste your key in the Render dashboard
      - key: ALLOW_PRIVATE_FETCH
        value: "false"
      - key: JOB_WORKERS
        value: "2"

databases:
  - name: skillverse-db
    plan: free
