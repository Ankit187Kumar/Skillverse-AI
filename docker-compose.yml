# SkillVerse AI production stack.
#   cp .env.production.example .env   # then edit secrets and DOMAIN
#   docker compose up -d --build
# Optional services are enabled with profiles:
#   --profile local-ai   Ollama (local models; GPU strongly recommended)
#   --profile sandbox    Piston code-execution sandbox (Coding Lab)
#   --profile search     SearXNG web search (Research Agent)
#   --profile voice      Speaches speech-to-text / text-to-speech server

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillverse
      POSTGRES_USER: skillverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillverse -d skillverse"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://skillverse:${POSTGRES_PASSWORD}@db:5432/skillverse
      COOKIE_SECURE: "true"
    depends_on:
      db: {condition: service_healthy}
    # Not published: only reachable from the frontend container.

  frontend:
    build:
      context: ./frontend
      args: {BACKEND_URL: "http://backend:8000"}
    restart: unless-stopped
    depends_on: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [frontend]

  ollama:
    image: ollama/ollama:latest
    profiles: [local-ai]
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    # For NVIDIA GPUs, uncomment:
    # deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}

  piston:
    image: ghcr.io/engineer-man/piston:latest
    profiles: [sandbox]
    restart: unless-stopped
    privileged: true  # Piston needs this to create its own isolated sandboxes for each run
    tmpfs: [/piston/jobs:exec,uid=1000,gid=1000,mode=711]
    volumes: [piston-packages:/piston/packages]

  searxng:
    image: searxng/searxng:latest
    profiles: [search]
    restart: unless-stopped
    volumes: [./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro]

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: [voice]
    restart: unless-stopped
    volumes: [hf-cache:/home/ubuntu/.cache/huggingface]

volumes:
  db-data:
  caddy-data:
  ollama-data:
  piston-packages:
  hf-cache:
